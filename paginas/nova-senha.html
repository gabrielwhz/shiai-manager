<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nova senha — Shiai Manager</title>
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/estilo.css?v=6">
  </head>
  <body>
    <div class="box-centro">
      <div class="card stack">
        <div class="marca" style="color:inherit"><img src="../assets/logo.svg" alt="" width="40" height="40"><span><b>Shiai Manager</b></span></div>
        <h2>Criar nova senha</h2>
        <p class="mut" id="status">Confirmando o link…</p>
        <form id="fSenha" class="stack" hidden novalidate>
          <label class="field">Nova senha<input type="password" name="s1" autocomplete="new-password" minlength="6" required></label>
          <label class="field">Repita a nova senha<input type="password" name="s2" autocomplete="new-password" minlength="6" required></label>
          <button class="btn big" id="salvar" type="submit">Salvar nova senha</button>
        </form>
        <div class="msg" id="msg" hidden role="status"></div>
        <p id="links" hidden><a class="btn alt" href="painel.html">Ir para minhas competições</a></p>
        <p id="voltar" hidden><a href="login.html">Voltar para o login</a></p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/comum.js?v=6"></script>
    <script src="../js/nova-senha.js?v=6"></script>
  </body>
</html>
